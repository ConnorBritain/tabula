# Gates on every pull request and on main: the tests and the publish check (.claude/gates.json).
# The app has no package.json. Install browser-test tools outside the checkout.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install browser-test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tabula-ci" --no-save --package-lock=false playwright@1.65.1
          "$RUNNER_TEMP/tabula-ci/node_modules/.bin/playwright" install --with-deps chromium
      - run: node --test
        env:
          NODE_PATH: ${{ runner.temp }}/tabula-ci/node_modules
      # The leak guard reads its private term list from the LEAK_TERMS secret. With no secret it skips with a note.
      # In CI it prints file:line and a term number only, never the term text.
      - run: node check-publish.mjs
        env:
          TABULA_LEAK_TERMS_TEXT: ${{ secrets.LEAK_TERMS }}
