<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tabula Speech Events prototype</title>
<!-- A throwaway prototype for the 5-judge lay test (docs/events/PROTOTYPE-TEST.md). It is not the app.
     No AI, no network calls, no recording. Data stays in this browser under tabulaEvents.proto.* keys. -->
<link rel="stylesheet" href="../../assets/tokens.css">
<link rel="stylesheet" href="proto.css">
</head>
<body>
<a class="skip" href="#main">Skip to the screen</a>
<header class="bar">
  <div class="brand"><span class="brand-name">Tabula Speech Events</span> <span class="pill quiet-pill">Prototype</span></div>
  <nav class="steps" aria-label="Steps">
    <button type="button" class="b quiet" data-act="go" data-screen="setup" data-key="nav-setup">Setup</button>
    <button type="button" class="b quiet" data-act="go" data-screen="room" data-key="nav-room">Room</button>
    <button type="button" class="b quiet" data-act="go" data-screen="rank" data-key="nav-rank">Rank</button>
    <button type="button" class="b quiet" data-act="go" data-screen="review" data-key="nav-review">Review</button>
  </nav>
  <button type="button" class="b quiet theme-btn" data-act="theme" data-key="theme" aria-label="Theme: Auto">Theme: Auto</button>
</header>
<main id="main" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="ask" aria-labelledby="ask-title">
  <form method="dialog">
    <h2 id="ask-title"></h2>
    <p id="ask-body"></p>
    <label id="ask-field" class="field" hidden><span id="ask-field-label"></span><input id="ask-input" autocomplete="off"></label>
    <p id="ask-error" class="field-error" hidden></p>
    <div class="row-end">
      <button type="submit" class="b" value="cancel">Cancel</button>
      <button type="submit" class="b primary" value="ok" id="ask-ok">OK</button>
    </div>
  </form>
</dialog>
<dialog id="roster-sheet" class="sheet" aria-labelledby="roster-sheet-title">
  <div class="sheet-head"><h2 id="roster-sheet-title">Roster</h2><button type="button" class="b" data-act="close-sheet" data-key="close-sheet">Close</button></div>
  <div id="roster-sheet-body"></div>
</dialog>
<script src="data.js"></script>
<script src="proto.js"></script>
</body>
</html>
