<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tabula Speech Events</title>
<!-- Tabula Speech Events (docs/events/LANDING.md §4.1, step E1): the page shell. It runs on the shared core/ ES modules
     and its own events/js/ modules. Not public yet: it runs on a preview host until v1 is ready. -->
<script src="../assets/theme-boot.js" data-settings="tabulaEvents.settings.v1"></script>
<!-- The AI gate (core/policy.js) is a head file: it runs before the first paint, so a removed AI tool never flashes. -->
<script src="../core/policy.js"></script>
<link rel="stylesheet" href="../core/tokens.css">
<link rel="stylesheet" href="../core/ui.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="congress/congress.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the main content</a>
<!-- The header on every screen (step S2, docs/events/EXPERIENCE.md §1.1): the brand (home), the mode menu (hidden until
     someone turns on Coach or Student), History, Settings, and the offline chip. No underline tabs (DESIGN.md §1). -->
<header class="bar">
  <a class="brand" href="#/">Tabula Speech Events</a>
  <label class="mode-menu" id="mode-menu" hidden><span class="sr-only">Mode</span><select id="mode-select"></select></label>
  <nav class="bar-nav" aria-label="Main">
    <span class="pill outline" id="offline-chip" hidden>Offline</span>
    <a class="b quiet" id="nav-history" href="#/history">History</a>
    <a class="b quiet" id="nav-settings" href="#/settings">Settings</a>
  </nav>
</header>
<main id="main" tabindex="-1">
  <!-- Every screen draws in #screen; #/ is My day (step S3, EXPERIENCE.md §1.2). -->
  <p class="muted" id="boot-status" role="status">Loading the events…</p>
  <div id="screen"></div>
</main>
<div class="toasts" id="toasts"></div>
<div class="sr-only" id="toasts-polite" role="status" aria-live="polite"></div>
<div class="sr-only" id="toasts-alert" role="alert" aria-live="assertive"></div>
<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>
<!-- The palette, "Search and commands" (step S2, EXPERIENCE.md §7): ⌘K or Ctrl+K on any screen. -->
<div class="overlay palette-wrap" id="palette" hidden>
  <div class="palette" id="palette-card" role="dialog" aria-modal="true" aria-label="Search and commands">
    <input id="pal-input" type="text" role="combobox" autocomplete="off" spellcheck="false" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" aria-label="Search commands and rounds" placeholder="Search commands and rounds">
    <div class="pal-list" id="pal-list" role="listbox" aria-label="Commands"></div>
    <p class="muted pal-empty" id="pal-empty" hidden>No match. Try "history", "new" or an event like "HI".</p>
    <p class="muted pal-foot" aria-hidden="true">↑↓ to move · ↵ to run · Esc to close</p>
  </div>
</div>
<div id="ask" class="overlay" hidden>
  <div class="overlay-card" id="ask-card" role="dialog" aria-modal="true" aria-labelledby="ask-title" aria-describedby="ask-body">
    <h2 id="ask-title"></h2>
    <button class="iconbtn ask-x" id="ask-x" type="button" aria-label="Close">×</button>
    <div class="ask-body" id="ask-body"></div>
    <div class="ask-field" id="ask-field" hidden>
      <label for="ask-input" id="ask-label"></label>
      <input id="ask-input" type="text" autocomplete="off" aria-describedby="ask-err">
      <p class="ask-err" id="ask-err" aria-live="polite"></p>
    </div>
    <p class="muted ask-foot" id="ask-foot"></p>
    <div class="ask-btns" id="ask-btns"></div>
  </div>
</div>
</body>
</html>
